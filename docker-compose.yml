services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: iastech-app

    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./dataset:/app/dataset
      - ./tests:/app/tests

    working_dir: /app

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      # Checkpoint do detector. O arquivo NÃO vai para o Git: copie o .pt
      # gerado no treino para data/models/ (o volume ./data já o expõe
      # dentro do container).
      DETECTOR_CHECKPOINT_PATH: "data/models/faster_rcnn.pt"
      DETECTOR_SCORE_THRESHOLD: "0.5"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
